name: Deploy QuizRounds2 r62 no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-quizrounds2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar release r62
        run: node scripts/validate-build.mjs

      - name: Montar site estático r62
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages.mjs

      - name: Validar artefato que será publicado
        run: node scripts/validate-pages.mjs _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar r62 realmente publicada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          published=0
          for attempt in $(seq 1 18); do
            marker="$(curl -fsSL -H 'Cache-Control: no-cache' "${base}/version.json?run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if printf '%s' "$marker" | grep -q '"build": "3.68-r62"'; then
              published=1
              break
            fi
            echo "Aguardando propagação do Pages (${attempt}/18)…"
            sleep 5
          done
          if [ "$published" -ne 1 ]; then
            echo "::error::O GitHub Pages não está servindo a r62 após o deploy."
            exit 1
          fi
          for page in index.html admin.html display.html simulator.html admin/; do
            curl -fsSL -H 'Cache-Control: no-cache' "${base}/${page}?build=3.68-r62&run=${GITHUB_RUN_ID}" | grep -q '3.68-r62' || {
              echo "::error::${page} não está servindo a r62."
              exit 1
            }
          done
          curl -fsSL -H 'Cache-Control: no-cache' "${base}/assets/js/common-v3.68-r62.js?run=${GITHUB_RUN_ID}" | grep -q "BUILD_ID='3.68-r62'" || {
            echo "::error::Runtime common-v3.68-r62.js não foi publicado corretamente."
            exit 1
          }
          echo "GitHub Pages confirmado em QuizRounds2 3.68-r62."
