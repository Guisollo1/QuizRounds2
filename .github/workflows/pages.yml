name: Deploy QuizRounds2 no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-quizrounds2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ler versão da release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          build="$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).build")"
          release="$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).release")"
          [[ "$build" =~ ^3\.68-r[0-9]+$ ]] || { echo "::error::BUILD_ID inválido: $build"; exit 1; }
          [[ "$release" =~ ^r[0-9]+$ ]] || { echo "::error::RELEASE inválida: $release"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Publicando QuizRounds2 $build ($release)"

      - name: Gate essencial da release
        run: node scripts/validate-release.mjs

      - name: Contrato comportamental de sincronização
        run: node scripts/validate-sync-behavior.mjs

      - name: Estresse operacional determinístico
        run: node scripts/validate-event-stress.mjs

      - name: Auditoria final bloqueante
        run: node scripts/validate-build.mjs

      - name: Montar site estático
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages.mjs

      - name: Validar artefato que será publicado
        run: node scripts/validate-pages.mjs _site

      - name: Smoke HTTP local do artefato
        run: node scripts/validate-site-smoke.mjs _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Aguardar propagação e confirmar publicação
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_ID: ${{ steps.release.outputs.build }}
          RELEASE: ${{ steps.release.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          max_attempts=60
          wait_seconds=10
          common="assets/js/common-v${BUILD_ID}.js"
          resources=(
            "version.json|\"build\": \"${BUILD_ID}\""
            "index.html|${BUILD_ID}"
            "admin.html|${BUILD_ID}"
            "display.html|${BUILD_ID}"
            "simulator.html|${BUILD_ID}"
            "admin/|${BUILD_ID}"
            "${common}|BUILD_ID='${BUILD_ID}'"
          )
          declare -A confirmed
          for spec in "${resources[@]}"; do confirmed["${spec%%|*}"]=0; done
          for attempt in $(seq 1 "$max_attempts"); do
            pending=0
            echo "Verificação de propagação ${attempt}/${max_attempts} para ${BUILD_ID}…"
            for spec in "${resources[@]}"; do
              path="${spec%%|*}"
              needle="${spec#*|}"
              [ "${confirmed[$path]}" -eq 1 ] && continue
              sep='?'; [[ "$path" == *'?'* ]] && sep='&'
              url="${base}/${path}${sep}qr_build=${BUILD_ID}&run=${GITHUB_RUN_ID}&attempt=${attempt}&ts=$(date +%s%N)"
              body="$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 20 -fsSL \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                -H 'Expires: 0' \
                "$url" || true)"
              if [[ "$body" == *"$needle"* ]]; then
                confirmed["$path"]=1
                echo "✓ ${path} propagado"
              else
                pending=$((pending+1))
                echo "… ${path} ainda não propagou"
              fi
            done
            if [ "$pending" -eq 0 ]; then
              echo "GitHub Pages confirmado integralmente em QuizRounds2 ${BUILD_ID} (${RELEASE})."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then sleep "$wait_seconds"; fi
          done
          echo "::error::O GitHub Pages não convergiu integralmente para ${BUILD_ID} dentro de $((max_attempts*wait_seconds/60)) minutos."
          for spec in "${resources[@]}"; do
            path="${spec%%|*}"
            if [ "${confirmed[$path]}" -ne 1 ]; then echo " - ${path}"; fi
          done
          exit 1
