name: Deploy QuizRounds2 r64 no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-quizrounds2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar release r64
        run: node scripts/validate-build.mjs

      - name: Montar site estático r64
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages.mjs

      - name: Validar artefato que será publicado
        run: node scripts/validate-pages.mjs _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Aguardar propagação e confirmar r64 publicada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          max_attempts=60
          wait_seconds=10

          # Todos estes recursos precisam pertencer à mesma release antes de a Action ficar verde.
          resources=(
            "version.json|\"build\": \"3.68-r64\""
            "index.html|3.68-r64"
            "admin.html|3.68-r64"
            "display.html|3.68-r64"
            "simulator.html|3.68-r64"
            "admin/|3.68-r64"
            "assets/js/common-v3.68-r64.js|BUILD_ID='3.68-r64'"
          )

          declare -A confirmed
          for spec in "${resources[@]}"; do confirmed["${spec%%|*}"]=0; done

          for attempt in $(seq 1 "$max_attempts"); do
            pending=0
            echo "Verificação de propagação ${attempt}/${max_attempts}…"

            for spec in "${resources[@]}"; do
              path="${spec%%|*}"
              needle="${spec#*|}"
              [ "${confirmed[$path]}" -eq 1 ] && continue

              sep='?'
              [[ "$path" == *'?'* ]] && sep='&'
              url="${base}/${path}${sep}qr_build=3.68-r64&run=${GITHUB_RUN_ID}&attempt=${attempt}&ts=$(date +%s%N)"
              body="$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 20 -fsSL \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                -H 'Expires: 0' \
                "$url" || true)"

              if [[ "$body" == *"$needle"* ]]; then
                confirmed["$path"]=1
                echo "✓ ${path} propagado"
              else
                pending=$((pending+1))
                echo "… ${path} ainda não propagou"
              fi
            done

            if [ "$pending" -eq 0 ]; then
              echo "GitHub Pages confirmado integralmente em QuizRounds2 3.68-r64."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then sleep "$wait_seconds"; fi
          done

          echo "::error::O GitHub Pages não convergiu integralmente para a r64 dentro de $((max_attempts*wait_seconds/60)) minutos."
          echo "Recursos ainda antigos:"
          for spec in "${resources[@]}"; do
            path="${spec%%|*}"
            if [ "${confirmed[$path]}" -ne 1 ]; then echo " - ${path}"; fi
          done
          exit 1
